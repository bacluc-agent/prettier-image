name: Autorelease
on:
  pull_request:
    # Run when PR head branch is updated (synchronize), when the set of PR
    # labels is changed (labeled, unlabeled), and after the PR is closed. We
    # additionally check for `merged==true` in the event payload on `closed`
    # before actually pushing the tag.
    types:
      - synchronize
      - labeled
      - unlabeled
      - closed
    # Changes confined to test-files don't warrant a new image release.
    paths-ignore:
      - "test-files/**"

jobs:
  create-release-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Record existing tags
        id: existing-tags
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const tags = await github.paginate(github.rest.repos.listTags, {
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            core.setOutput('names', JSON.stringify(tags.map(tag => tag.name)))

      - name: Create new tag
        uses: projectsyn/pr-label-tag-action@v1

      - name: Dispatch release workflow for the new tag
        if: github.event.action == 'closed' && github.event.pull_request.merged
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          EXISTING_TAGS: ${{ steps.existing-tags.outputs.names }}
        with:
          script: |
            const existingTags = new Set(JSON.parse(process.env.EXISTING_TAGS))
            const tags = await github.paginate(github.rest.repos.listTags, {
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            const newTag = tags.find(tag => !existingTags.has(tag.name))
            if (!newTag) return

            const { data: workflows } = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            const workflow = workflows.workflows.find(item => item.name === 'Test and release prettier image')
            if (!workflow) throw new Error('Release workflow not found')

            await github.request('POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflow.id,
              ref: `refs/tags/${newTag.name}`,
              headers: { 'X-GitHub-Api-Version': '2026-03-10' },
            })
